# Los headers de seguridad viven en public/_headers para que se apliquen
# también en deploys por CLI o arrastrando la carpeta dist.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Estas tres variables son configuración pública (URL del sitio, número de
  # WhatsApp y URL de la API), no credenciales. Sus valores aparecen en el
  # código y en el sitemap, por lo que el escaneo de secretos de Netlify los
  # marca falsos positivos. Se omiten solo estas llaves; el resto de secretos
  # (contraseña admin, tokens, API keys) siguen siendo escaneados.
  SECRETS_SCAN_OMIT_KEYS = "BLOG_API_URL,VITE_WHATSAPP_NUMBER,VITE_SITE_URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/reviews"
  to = "/.netlify/functions/reviews"
  status = 200
  force = true
